<style>
/* Navbar Centralized Styles */
header { position: sticky; top: 0; z-index: 1000; background: transparent; backdrop-filter: blur(5px); border-bottom: 1px solid transparent; padding: 20px 0; transition: all 0.3s ease; }
header.scrolled { background: linear-gradient(90deg, rgba(15,10,35,0.75) 0%, rgba(5,5,15,0.75) 100%); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.08); padding: 12px 0; box-shadow: 0 4px 30px rgba(0,0,0,0.3); }
.nav-container { display: flex; justify-content: space-between; align-items: center; }
.logo { font-size: 1.5rem; font-weight: 800; letter-spacing: 2px; }
.logo span { color: var(--accent2); }
.nav-links { display: flex; gap: 30px; align-items: center; }
.nav-links a { font-weight: 500; font-size: 0.95rem; transition: color 0.3s; text-decoration: none; color: var(--text); }
.nav-links a:hover { color: var(--accent2); }
.nav-links a:focus-visible, .menu-toggle:focus-visible { outline: 3px solid var(--accent2); outline-offset: 4px; border-radius: 6px; }

@media (max-width: 992px) {
    .nav-links { display: none; }
}

/* Dropdown CSS */
.dropdown { position: relative; display: inline-block; }
.dropdown-content { 
    display: none; position: absolute; background-color: rgba(5,5,8,0.95); 
    min-width: 300px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); border: 1px solid var(--border);
    border-radius: 12px; z-index: 1000; top: 100%; left: 0; padding: 10px 0; backdrop-filter: blur(15px);
    margin-top: 10px;
}
.dropdown-content::before {
    content: ""; position: absolute; top: -15px; left: 0; right: 0; height: 15px;
}
.dropdown:hover .dropdown-content, .dropdown:focus-within .dropdown-content { display: block; animation: fadeIn 0.2s ease-out; }
.dropdown-content a { 
    color: var(--muted) !important; padding: 12px 20px; text-decoration: none; display: block; font-size: 0.85rem; font-weight: 500; transition: all 0.2s;
}
.dropdown-content a:hover { background-color: rgba(255,255,255,0.05); color: var(--text) !important; padding-left: 25px; }
.dropdown-content .icon { margin-right: 10px; font-size: 1.1rem; vertical-align: middle;}
@keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
</style>
