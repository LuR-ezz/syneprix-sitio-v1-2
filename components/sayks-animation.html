<style>
.sayks-wrapper {
    width: 100%;
    height: 100%;
    min-height: 400px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 20px;
}
.sayks-node {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(15, 15, 20, 0.7);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 12px 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 15px rgba(255,255,255,0.02);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 2;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.sayks-node:hover {
    transform: translateY(-5px) scale(1.05) !important;
    box-shadow: 0 15px 40px rgba(89, 29, 203, 0.4), inset 0 0 20px rgba(89, 29, 203, 0.2);
    border-color: rgba(89, 29, 203, 0.5);
    z-index: 10;
}
.sayks-node img, .sayks-node svg {
    height: 35px;
    width: auto;
    margin-bottom: 8px;
    object-fit: contain;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
}
.sayks-node span {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.5px;
    text-transform: uppercase;
}
.sayks-center {
    position: relative;
    z-index: 3;
    /* Fondo opaco para que no se vean los cables detrás */
    background: linear-gradient(135deg, rgb(89, 29, 203), rgb(0, 150, 200));
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    padding: 20px 40px;
    box-shadow: 0 0 40px rgba(89, 29, 203, 0.5);
    animation: pulse-glow 3s infinite alternate;
}
.sayks-center span {
    font-size: 2rem;
    font-weight: 900;
    color: white;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
}
.sayks-center .subtitle {
    font-size: 0.9rem;
    font-weight: 700;
    color: rgba(255,255,255,0.9);
    margin-bottom: -5px;
    letter-spacing: 2px;
}
/* SVG Lines */
.sayks-lines {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
}
.base-cable {
    fill: none;
    stroke: rgba(255, 255, 255, 0.1);
    stroke-width: 2;
    stroke-linecap: round;
}
.energy-pulse {
    fill: none;
    stroke: var(--accent1); /* Cyan */
    stroke-width: 2.5; /* Más visible */
    stroke-linecap: round;
    filter: drop-shadow(0 0 6px var(--accent1)); /* Más resplandor para que se note */
    /* stroke-dasharray se setea en JS dinámicamente */
    animation: flow-pingpong 3.5s ease-in-out infinite alternate; /* Ping pong! */
    opacity: 0.9; /* Bien visible */
}
.energy-pulse.alt-color {
    stroke: var(--accent2); /* Purple */
    filter: drop-shadow(0 0 6px var(--accent2));
}

@keyframes flow-pingpong {
    0% {
        stroke-dashoffset: 40; /* El dash de 40px está oculto antes del inicio */
    }
    100% {
        stroke-dashoffset: var(--target-offset); /* Llega al final y se oculta */
    }
}

/* Floating Animations */
@keyframes float1 { 0% { transform: translateY(0px); } 50% { transform: translateY(-12px); } 100% { transform: translateY(0px); } }
@keyframes float2 { 0% { transform: translateY(0px); } 50% { transform: translateY(12px); } 100% { transform: translateY(0px); } }
@keyframes float3 { 0% { transform: translateY(-8px); } 50% { transform: translateY(8px); } 100% { transform: translateY(-8px); } }
@keyframes pulse-glow { 0% { box-shadow: 0 0 20px rgba(89, 29, 203, 0.4); } 100% { box-shadow: 0 0 50px rgba(89, 29, 203, 0.8), 0 0 20px rgba(0, 243, 255, 0.4); } }

/* Positioning Nodes */
/* Left Side (Industries) */
.node-sap { top: 15%; left: 8%; animation: float1 6s ease-in-out infinite; }
.node-matlab { top: 45%; left: 2%; animation: float2 5s ease-in-out infinite; }
.node-vulcan { top: 75%; left: 10%; animation: float3 7s ease-in-out infinite; }

/* Right Side (Core Tools) */
.node-excel { top: 15%; right: 8%; animation: float2 6.5s ease-in-out infinite; }
.node-powerbi { top: 45%; right: 2%; animation: float3 5.5s ease-in-out infinite; }
.node-n8n { top: 75%; right: 10%; animation: float1 7.5s ease-in-out infinite; }

@media (max-width: 768px) {
    .sayks-node { padding: 8px 12px; }
    .sayks-node img { height: 25px; }
    .sayks-node span { font-size: 0.65rem; }
    .sayks-center { padding: 15px 25px; }
    .sayks-center span { font-size: 1.5rem; }
    
    .node-sap { top: 5%; left: 2%; }
    .node-matlab { top: 45%; left: 0%; }
    .node-vulcan { top: 85%; left: 5%; }
    .node-excel { top: 5%; right: 2%; }
    .node-powerbi { top: 45%; right: 0%; }
    .node-n8n { top: 85%; right: 5%; }
}
</style>

<script>
(function() {
    function drawConnections(isResize = false) {
        const svg = document.querySelector('.sayks-lines');
        const g = document.querySelector('.connections-group');
        if (!svg || !g) return;
        
        const center = document.getElementById('node-center');
        const nodes = ['node-sap', 'node-matlab', 'node-vulcan', 'node-excel', 'node-powerbi', 'node-n8n'];
        
        const wrapper = document.querySelector('.sayks-wrapper');
        const wrapperRect = wrapper.getBoundingClientRect();
        
        if (wrapperRect.width === 0 || wrapperRect.height === 0) return;

        const centerRect = center.getBoundingClientRect();
        const cX = centerRect.left - wrapperRect.left + (centerRect.width / 2);
        const cY = centerRect.top - wrapperRect.top + (centerRect.height / 2);
        
        nodes.forEach((nodeId, index) => {
            const node = document.getElementById(nodeId);
            if(!node) return;
            const rect = node.getBoundingClientRect();
            
            let nX = rect.left - wrapperRect.left + (rect.width / 2);
            let nY = rect.top - wrapperRect.top + (rect.height / 2);
            
            if(nX < cX) nX += rect.width / 3; 
            if(nX > cX) nX -= rect.width / 3; 
            
            const controlPointX = cX + (nX - cX) / 2;
            const d = `M ${nX} ${nY} C ${controlPointX} ${nY}, ${controlPointX} ${cY}, ${cX} ${cY}`;
            
            let baseCable = document.getElementById(`base-${nodeId}`);
            let energyPulse = document.getElementById(`pulse-${nodeId}`);
            let isNew = false;
            
            if (!baseCable) {
                baseCable = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                baseCable.id = `base-${nodeId}`;
                baseCable.classList.add('base-cable');
                g.appendChild(baseCable);
            }
            
            if (!energyPulse) {
                energyPulse = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                energyPulse.id = `pulse-${nodeId}`;
                energyPulse.classList.add('energy-pulse');
                if (index % 2 !== 0) energyPulse.classList.add('alt-color');
                
                // Set animation delay once
                energyPulse.style.animationDelay = `-${index * 0.7}s`;
                g.appendChild(energyPulse);
                isNew = true;
            }
            
            // Only update D attribute to prevent CSS animation reset
            if (baseCable.getAttribute('d') !== d) {
                baseCable.setAttribute('d', d);
                energyPulse.setAttribute('d', d);
            }
            
            if (isNew || isResize) {
                const pathLength = energyPulse.getTotalLength() || 350;
                energyPulse.style.strokeDasharray = `40 ${pathLength}`;
                energyPulse.style.setProperty('--target-offset', `-${pathLength}px`);
            }
        });
    }

    setTimeout(() => drawConnections(true), 300);
    
    const resizeObserver = new ResizeObserver(() => {
        drawConnections(true);
    });
    const wrapper = document.querySelector('.sayks-wrapper');
    if(wrapper) resizeObserver.observe(wrapper);
    
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let isVisible = true;
    let lastFrame = 0;

    const visibilityObserver = new IntersectionObserver(([entry]) => {
        isVisible = entry.isIntersecting;
        if (isVisible) drawConnections(true);
    });
    if (wrapper) visibilityObserver.observe(wrapper);

    function animateConnections(timestamp) {
        if (isVisible && timestamp - lastFrame >= 50) {
            drawConnections();
            lastFrame = timestamp;
        }
        requestAnimationFrame(animateConnections);
    }

    if (!prefersReducedMotion) requestAnimationFrame(animateConnections);
})();
</script>
