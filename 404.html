<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada - SYNEPRIX</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .bg-elements {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
    }
    .glow {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(208,77,205,0.15) 0%, rgba(0,0,0,0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
    }
    
    .container {
      text-align: center;
      padding: 2rem;
      z-index: 1;
    }
    
    .error-code {
      font-size: 12rem;
      font-weight: 800;
      line-height: 1;
      margin: 0;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -5px;
      text-shadow: 0 10px 30px rgba(89, 29, 203, 0.3);
    }
    
    h1 {
      font-size: 2rem;
      font-weight: 600;
      margin-top: 1rem;
      margin-bottom: 0.5rem;
    }
    
    p {
      color: var(--muted);
      font-size: 1.2rem;
      margin-bottom: 3rem;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }
    
    .btn {
      display: inline-block;
      background: var(--glass);
      color: var(--text);
      padding: 1rem 2rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
      transition: all 0.3s;
    }
    .btn:hover {
      background: var(--gradient);
      border-color: transparent;
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(208, 77, 205, 0.4);
    }
    
    @media (max-width: 768px) {
      .error-code { font-size: 8rem; }
      h1 { font-size: 1.5rem; }
      p { font-size: 1rem; }
    }
  
    /* === DISEÑO ORGÁNICO: SIN CAJAS Y ANIMACIONES SHOJI === */
    .glass-panel, .escuela-card, .hero-stat-card, .testimonio-card, .curso-card, .feature-card, .animate-on-scroll {
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        backdrop-filter: none !important;
    }
    
    .animate-on-scroll {
        opacity: 0;
        transition: opacity 1.2s cubic-bezier(0.22, 1, 0.36, 1), transform 1.2s cubic-bezier(0.22, 1, 0.36, 1) !important;
        will-change: opacity, transform;
    }
    .animate-on-scroll.shoji-left {
        transform: translateX(-100px);
    }
    .animate-on-scroll.shoji-right {
        transform: translateX(100px);
    }
    .animate-on-scroll:not(.shoji-left):not(.shoji-right) {
        transform: translateY(30px);
    }
    .animate-on-scroll.visible {
        opacity: 1 !important;
        transform: translate(0, 0) !important;
    }

</style>
    <!-- Tipografia Corporativa Inter -->

<!-- ANIMACIONES SHOJI ORGÁNICAS -->
<script>
document.addEventListener('DOMContentLoaded', () => {
    // 1. Asignar clase de animacion a elementos "caja" que no la tengan
    const candidateSelectors = '.glass-panel, .escuela-card, .testimonio-card, .curso-card, .hero-stat-card, section > .container > div:not(.nav-container)';
    document.querySelectorAll(candidateSelectors).forEach(el => {
        if (!el.classList.contains('animate-on-scroll')) {
            el.classList.add('animate-on-scroll');
        }
    });

    // 2. Intercalar shoji-left y shoji-right
    const animateElements = document.querySelectorAll('.animate-on-scroll');
    animateElements.forEach((el, index) => {
        // Solo aplicar si no lo tiene (previniendo dobles aplicaciones)
        if (!el.classList.contains('shoji-left') && !el.classList.contains('shoji-right')) {
            if (index % 2 === 0) {
                el.classList.add('shoji-left');
            } else {
                el.classList.add('shoji-right');
            }
        }
    });

    // 3. Crear observer
    // Si la pagina ya tiene un IntersectionObserver de animate-on-scroll, 
    // este simplemente asegurara que las clases visible se manejen.
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('visible');
            } else {
                entry.target.classList.remove('visible'); // Rebote para re-animar
            }
        });
    }, { threshold: 0.15 });

    animateElements.forEach(el => observer.observe(el));
});
</script>

</body>
