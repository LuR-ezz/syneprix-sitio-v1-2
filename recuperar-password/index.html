<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar contraseña — SYNEPRIX</title>
  <meta name="description" content="Recupera el acceso a tu cuenta SYNEPRIX. Te enviaremos un enlace de restablecimiento a tu correo electrónico." />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    

    html, body {
      min-height: 100%;
      font-family: 'InterVariable', 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 20px;
      position: relative;
      overflow: hidden;
    }

    /* ─── BACKGROUND GLOW ─── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 50% 40%, rgba(89,29,203,0.18) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 60% 70%, rgba(208,77,205,0.10) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* Subtle grid texture */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
    }

    /* ─── LOGO ─── */
    .logo-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 20px 32px;
      z-index: 10;
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text);
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: -0.3px;
    }
    .logo .bolt {
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 1.4rem;
    }

    /* ─── CARD ─── */
    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 440px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 44px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow:
        0 0 0 1px rgba(89,29,203,0.1),
        0 24px 80px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.08);
    }

    /* Top accent bar */
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 2px;
      background: var(--gradient);
      border-radius: 0 0 4px 4px;
    }

    .icon-wrap {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(89,29,203,0.3), rgba(208,77,205,0.3));
      border: 1px solid rgba(89,29,203,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      margin-bottom: 24px;
    }

    .card h1 {
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -0.8px;
      margin-bottom: 8px;
    }
    .card .sub {
      font-size: 0.875rem;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .field { margin-bottom: 20px; }
    .field label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 7px;
      letter-spacing: 0.3px;
    }
    .field input {
      width: 100%;
      padding: 14px 16px;
      background: var(--glass-panel-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'InterVariable', 'Inter', sans-serif;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field input::placeholder { color: rgba(255,255,255,0.25); }
    .field input:focus {
      border-color: var(--accent3);
      box-shadow: 0 0 0 3px rgba(127,119,221,0.15);
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--gradient);
      border: none;
      border-radius: 10px;
      color: var(--text);
      font-family: 'InterVariable', 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: opacity 0.2s, transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 24px rgba(89,29,203,0.35);
      margin-bottom: 20px;
    }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 8px 32px rgba(89,29,203,0.5); }

    .back-link {
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: center;
      font-size: 0.85rem;
      color: var(--muted);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--accent3); }

    /* ─── SUCCESS STATE ─── */
    .success-state {
      display: none;
      text-align: center;
    }
    .success-icon {
      font-size: 3rem;
      margin-bottom: 16px;
    }
    .success-state h3 {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .success-state p {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.6;
    }
    .success-state.visible { display: block; }
    .form-state.hidden { display: none; }

    @media (max-width: 480px) {
      .card { padding: 36px 28px; }
      .card h1 { font-size: 1.4rem; }
    }
  
    /* === DISEÑO ORGÁNICO: SIN CAJAS Y ANIMACIONES SHOJI === */
    .glass-panel, .escuela-card, .hero-stat-card, .testimonio-card, .curso-card, .feature-card, .animate-on-scroll {
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        backdrop-filter: none !important;
    }
    
    .animate-on-scroll {
        opacity: 0;
        transition: opacity 1.2s cubic-bezier(0.22, 1, 0.36, 1), transform 1.2s cubic-bezier(0.22, 1, 0.36, 1) !important;
        will-change: opacity, transform;
    }
    .animate-on-scroll.shoji-left {
        transform: translateX(-100px);
    }
    .animate-on-scroll.shoji-right {
        transform: translateX(100px);
    }
    .animate-on-scroll:not(.shoji-left):not(.shoji-right) {
        transform: translateY(30px);
    }
    .animate-on-scroll.visible {
        opacity: 1 !important;
        transform: translate(0, 0) !important;
    }

</style>
    <!-- Tipografia Corporativa Inter -->
    <link rel="stylesheet" href="../assets/fonts/inter/inter.css">
    <!-- Estilos Responsivos -->
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <!-- Script Responsivo -->
    <script src="../assets/js/responsive.js" defer></script>
    <!-- Sistema de Temas -->
    <link rel="stylesheet" href="../assets/css/theme.css">
    <script src="/assets/js/loadComponents.js" defer></script>
</head>
<body>

  <!-- LOGO BAR -->
  <nav class="logo-bar">
    <a href="../index.html" class="logo" aria-label="Inicio Syneprix">
      <span class="bolt">⚡</span>
      <span>SYNEPRIX</span>
    </a>
  </nav>

  <!-- CARD -->
  <div class="card" role="main">

    <!-- FORM STATE -->
    <div class="form-state" id="formState">
      <div class="icon-wrap" aria-hidden="true">🔐</div>
      <h1>Recupera tu contraseña</h1>
      <p class="sub">Te enviaremos un enlace seguro a tu email para restablecer tu acceso.</p>

      <form id="recover-form" novalidate>
        <div class="field">
          <label for="recover-email">Correo electrónico</label>
          <input
            type="email"
            id="recover-email"
            name="email"
            placeholder="tu@email.com"
            autocomplete="email"
            required
          />
        </div>
        <button type="submit" class="btn-primary" id="submit-btn">Enviar enlace →</button>
      </form>

      <a href="../login/index.html" class="back-link">← Volver al login</a>
    </div>

    <!-- SUCCESS STATE -->
    <div class="success-state" id="successState" aria-live="polite">
      <div class="success-icon">✅</div>
      <h3>¡Enlace enviado!</h3>
      <p>Revisa tu bandeja de entrada. Si el email está registrado, recibirás el enlace en unos minutos.</p>
      <br>
      <a href="../login/index.html" class="back-link">← Volver al login</a>
    </div>

  </div>

<script>
  document.getElementById('recover-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const email = document.getElementById('recover-email').value.trim();
    if (!email) return;
    const btn = document.getElementById('submit-btn');
    btn.textContent = 'Enviando...';
    btn.disabled = true;
    setTimeout(() => {
      document.getElementById('formState').classList.add('hidden');
      document.getElementById('successState').classList.add('visible');
    }, 1200);
  });
</script>
    <script src="/js/auth-state.js"></script>

<!-- ANIMACIONES SHOJI ORGÁNICAS -->
<script>
document.addEventListener('DOMContentLoaded', () => {
    // 1. Asignar clase de animacion a elementos "caja" que no la tengan
    const candidateSelectors = '.glass-panel, .escuela-card, .testimonio-card, .curso-card, .hero-stat-card, section > .container > div:not(.nav-container)';
    document.querySelectorAll(candidateSelectors).forEach(el => {
        if (!el.classList.contains('animate-on-scroll')) {
            el.classList.add('animate-on-scroll');
        }
    });

    // 2. Intercalar shoji-left y shoji-right
    const animateElements = document.querySelectorAll('.animate-on-scroll');
    animateElements.forEach((el, index) => {
        // Solo aplicar si no lo tiene (previniendo dobles aplicaciones)
        if (!el.classList.contains('shoji-left') && !el.classList.contains('shoji-right')) {
            if (index % 2 === 0) {
                el.classList.add('shoji-left');
            } else {
                el.classList.add('shoji-right');
            }
        }
    });

    // 3. Crear observer
    // Si la pagina ya tiene un IntersectionObserver de animate-on-scroll, 
    // este simplemente asegurara que las clases visible se manejen.
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('visible');
            } else {
                entry.target.classList.remove('visible'); // Rebote para re-animar
            }
        });
    }, { threshold: 0.15 });

    animateElements.forEach(el => observer.observe(el));
});
</script>


    <!-- Audio de Pronunciación -->
    <audio id="syneprixVoice" src="../assets/audio/Voz_Syneprix.mp3"></audio>
</body>
</html>
